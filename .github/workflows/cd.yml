name: GitHub Action Project 

on: 
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: deploy via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ubuntu 
          key : ${{secrets.SSH_KEY}}
          script: |
            cd /root/GithubAction 
            git pull 
            docker build -t app01 .
            docker run -d --name app01 -p 80:80 app01

